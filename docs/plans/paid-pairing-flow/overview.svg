<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
<title id="title">付费双人相处指南：主流程评审</title><desc id="desc">当前方案默认双方分别解锁所选报告。发起者了解权益、解锁并同意公开后发送邀请；好友了解费用、选结果或测试、解锁并单独同意；服务端校验后生成仅双方可读的三段指南。免费单人分享独立保留。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#788d95"/></marker></defs>
<rect width="1600" height="1130" fill="#edf2f3"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="60" y="62" font-size="34" fill="#171b1c" font-weight="600" text-anchor="start">双人相处指南 · 主流程评审</text>
<text x="60" y="98" font-size="19" fill="#52656e" font-weight="400" text-anchor="start">付费前展示价值 → 付费后直接邀请 → 双方确认后获得私密指南</text>
<rect x="1150" y="38" width="390" height="40" rx="20" fill="#f5ebe3" stroke="#d2b59e"/>
<text x="1345" y="64" font-size="16" fill="#775c48" font-weight="500" text-anchor="middle">待实施方案 · 当前默认双方分别付费</text>
<text x="1540" y="104" font-size="14" fill="#52656e" font-weight="400" text-anchor="end">2026-09-17 · 收费细则仍可评审</text>
<path d="M60,126 H1540" stroke="#cbd5d8"/>
<circle cx="77" cy="160" r="17" fill="#171b1c"/>
<text x="77" y="166" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">A</text>
<text x="108" y="167" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">发起者：从个人理解到发出邀请</text>
<text x="1540" y="167" font-size="15" fill="#52656e" font-weight="400" text-anchor="end">已购结果可直接进入邀请；无需先公开单人卡</text>
<rect x="60" y="194" width="272" height="140" rx="14" fill="#ffffff" stroke="#cbd5d8" stroke-width="1.5"/>
<text x="82" y="230" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">看见使用价值</text>
<text x="82" y="264" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">沟通示例＋三段产物</text>
<text x="82" y="290" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">购买前了解双方费用</text>
<path d="M336,264 L355,264" fill="none" stroke="#788d95" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="362" y="194" width="272" height="140" rx="14" fill="#f5ebe3" stroke="#c49473" stroke-width="1.5"/>
<text x="384" y="230" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">解锁所选报告</text>
<text x="384" y="264" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">服务端确认这份结果权益</text>
<text x="384" y="290" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">已解锁则跳过支付</text>
<path d="M638,264 L657,264" fill="none" stroke="#788d95" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="664" y="194" width="272" height="140" rx="14" fill="#ffffff" stroke="#cbd5d8" stroke-width="1.5"/>
<text x="686" y="230" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">点击「邀请一个人」</text>
<text x="686" y="264" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">结果页／报告页／我的报告</text>
<text x="686" y="290" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">进入配对中心</text>
<path d="M940,264 L959,264" fill="none" stroke="#788d95" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="966" y="194" width="272" height="140" rx="14" fill="#f5ebe3" stroke="#c49473" stroke-width="1.5"/>
<text x="988" y="230" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">单独同意公开</text>
<text x="988" y="264" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">预览四维、问卷与日期</text>
<text x="988" y="290" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">默认不勾选，不公开分数</text>
<path d="M1242,264 L1261,264" fill="none" stroke="#788d95" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1268" y="194" width="272" height="140" rx="14" fill="#ffffff" stroke="#cbd5d8" stroke-width="1.5"/>
<text x="1290" y="230" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">生成并发送邀请</text>
<text x="1290" y="264" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">邀请有效期 30 日</text>
<text x="1290" y="290" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">复制链接，由用户自行发送</text>
<path d="M1404,334 V370 H30 V546 H52" fill="none" stroke="#788d95" stroke-width="2" marker-end="url(#arrow)"/>
<text x="800" y="396" font-size="17" fill="#52656e" font-weight="400" text-anchor="middle">邀请页先说明参与价值和费用，再让好友决定是否继续</text>
<circle cx="77" cy="442" r="17" fill="#171b1c"/>
<text x="77" y="448" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">B</text>
<text x="108" y="449" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">好友：先了解自己，再确认参与</text>
<text x="1540" y="449" font-size="15" fill="#52656e" font-weight="400" text-anchor="end">付款只解锁资格；好友参与仍需另一次明确同意</text>
<rect x="60" y="476" width="272" height="140" rx="14" fill="#ffffff" stroke="#cbd5d8" stroke-width="1.5"/>
<text x="82" y="512" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">打开好友邀请</text>
<text x="82" y="546" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">看示例与发起者公开信息</text>
<text x="82" y="572" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">测试前已知双方费用</text>
<path d="M336,546 L355,546" fill="none" stroke="#788d95" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="362" y="476" width="272" height="140" rx="14" fill="#ffffff" stroke="#cbd5d8" stroke-width="1.5"/>
<text x="384" y="512" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">选结果或免费测试</text>
<text x="384" y="546" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">已有结果可直接选择</text>
<text x="384" y="572" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">新用户沿用原问卷流程</text>
<path d="M638,546 L657,546" fill="none" stroke="#788d95" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="664" y="476" width="272" height="140" rx="14" fill="#ffffff" stroke="#cbd5d8" stroke-width="1.5"/>
<text x="686" y="512" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">先看自己的结果</text>
<text x="686" y="546" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">正常免费概览先可阅读</text>
<text x="686" y="572" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">可以退出，保留个人内容</text>
<path d="M940,546 L959,546" fill="none" stroke="#788d95" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="966" y="476" width="272" height="140" rx="14" fill="#f5ebe3" stroke="#c49473" stroke-width="1.5"/>
<text x="988" y="512" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">核对所选报告权益</text>
<text x="988" y="546" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">已购直接继续</text>
<text x="988" y="572" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">未购且允许时再支付</text>
<path d="M1242,546 L1261,546" fill="none" stroke="#788d95" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1268" y="476" width="272" height="140" rx="14" fill="#f5ebe3" stroke="#c49473" stroke-width="1.5"/>
<text x="1290" y="512" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">单独同意参与</text>
<text x="1290" y="546" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">预览自己的共享范围</text>
<text x="1290" y="572" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">只向这份邀请的发起者展示</text>
<path d="M1404,616 V654 H30 V813 H52" fill="none" stroke="#788d95" stroke-width="2" marker-end="url(#arrow)"/>
<text x="800" y="680" font-size="17" fill="#52656e" font-weight="400" text-anchor="middle">提交时再次确认邀请仍有效、双方有权使用所选结果</text>
<circle cx="77" cy="724" r="17" fill="#171b1c"/>
<text x="77" y="730" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">C</text>
<text x="108" y="731" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">共同产物：生成、阅读与回访</text>
<text x="1540" y="731" font-size="15" fill="#52656e" font-weight="400" text-anchor="end">每个好友各有独立指南；第三人拿到链接也不能阅读</text>
<rect x="60" y="758" width="420" height="146" rx="14" fill="#ffffff" stroke="#cbd5d8" stroke-width="1.5"/>
<text x="82" y="794" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">服务端最终校验</text>
<text x="82" y="828" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">本人身份、双方权益与明确同意</text>
<text x="82" y="854" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">邀请有效且没有撤回；重试不重复生成</text>
<path d="M490,831 L565,831" fill="none" stroke="#788d95" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="574" y="758" width="452" height="146" rx="14" fill="#171b1c" stroke="#171b1c" stroke-width="1.5"/>
<text x="596" y="794" font-size="21" fill="#edf2f3" font-weight="600" text-anchor="start">冻结三段双人相处指南</text>
<text x="596" y="828" font-size="16" fill="#bdcbd0" font-weight="400" text-anchor="start">可能容易理解的地方 · 需要说清楚的地方</text>
<text x="596" y="854" font-size="16" fill="#bdcbd0" font-weight="400" text-anchor="start">下次可以怎么说：开口例句＋小约定</text>
<path d="M1036,831 L1103,831" fill="none" stroke="#788d95" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1112" y="758" width="428" height="146" rx="14" fill="#ffffff" stroke="#cbd5d8" stroke-width="1.5"/>
<text x="1134" y="794" font-size="21" fill="#171b1c" font-weight="600" text-anchor="start">双方私密阅读与回访</text>
<text x="1134" y="828" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">从「我的双人指南」查看</text>
<text x="1134" y="854" font-size="16" fill="#52656e" font-weight="400" text-anchor="start">任一方可撤回这份指南</text>
<path d="M60,936 H1540" stroke="#cbd5d8"/>
<text x="60" y="972" font-size="18" fill="#171b1c" font-weight="600" text-anchor="start">免费支线始终保留</text>
<text x="280" y="972" font-size="18" fill="#52656e" font-weight="400" text-anchor="start">本人结果 → 三选三相处说明书 → 确认公开 → 保存图片／复制链接</text>
<text x="60" y="1010" font-size="18" fill="#171b1c" font-weight="600" text-anchor="start">三条评审边界</text>
<text x="280" y="1010" font-size="18" fill="#52656e" font-weight="400" text-anchor="start">购买 ≠ 同意参与　　复制 ≠ 好友收到　　邀请到期 ≠ 已有指南被撤回</text>
<text x="60" y="1070" font-size="15" fill="#52656e" font-weight="400" text-anchor="start">成功路径总览；拒绝购买、全均衡、付款续接、失效与历史规则见配套详细流程图。</text>
<text x="1540" y="1070" font-size="15" fill="#52656e" font-weight="500" text-anchor="end">观己 / mirror</text>
</g></svg>